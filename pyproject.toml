[project]
name = "docuchat-ai"
version = "2.0.0"
description = "Enterprise Production-Grade RAG & Multi-Agent Platform powered by LangGraph, Pinecone, and Gemini"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "better-profanity>=0.7.0",
    "docling>=2.57.0",
    "fastapi>=0.116.1",
    "greenlet>=3.0.0",
    "guardrails-ai>=0.6.7",
    "hf-xet>=1.1.9",
    "joblib>=1.5.2",
    "jsonref>=1.1.0",
    "langchain>=0.3.27",
    "langchain-core>=0.3.75",
    "langchain-experimental>=0.3.4",
    "langchain-google-genai>=2.1.10",
    "langchain-huggingface>=0.3.1",
    "langgraph>=0.6.6",
    "langgraph-supervisor>=0.0.29",
    "llama-index>=0.14.0",
    "numpy>=2.0.0",
    "opentelemetry-api>=1.37.0",
    "opentelemetry-sdk>=1.37.0",
    "pandas>=2.2.0",
    "pinecone>=7.3.0",
    "pydash>=8.0.5",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.0.0",
    "pypdf>=6.0.0",
    "python-dotenv>=1.1.1",
    "regex>=2024.0.0",
    "scikit-learn>=1.5.0",
    "sentence-transformers>=3.0.0",
    "sqlalchemy>=2.0.30",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
]
