name: DocuChat-AI CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test-and-lint:
    name: Test & Lint Suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .
          pip install pytest pytest-asyncio httpx

      - name: Run Pytest Test Suite
        env:
          GOOGLE_API_KEY: "dummy-ci-key-for-testing"
          PINECONE_API_KEY: "dummy-ci-key-for-testing"
          PINECONE_INDEX: "rag-bot"
          JWT_SECRET_KEY: "ci-test-secret-key-32-chars-long"
          DATABASE_URL: "sqlite:///./test_ci.db"
        run: |
          pytest tests/ -v

      - name: Verify Evaluation Benchmark Runner
        run: |
          python -m src.evaluation.runner --help

  docker-build:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    needs: test-and-lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: docuchat-ai:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
